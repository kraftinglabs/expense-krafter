[project]
name = "expensekrafter"
version = "0.1.0"
description = "ExpenseKrafter: personal desktop expense tracker for bank accounts and credit cards, by Kraftinglabs"
requires-python = ">=3.11"
dependencies = [
    "nicegui[native,plotly]>=2.10",
    "sqlmodel>=0.0.22",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pdfplumber>=0.11",
    "desktop-notifier>=6.0",
    "keyring>=25",
    "msoffcrypto-tool>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5"]
build = ["pyinstaller>=6.10"]

[project.scripts]
expensekrafter = "expensekrafter.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["expensekrafter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
