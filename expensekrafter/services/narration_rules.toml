# How raw bank descriptions are turned into readable rows.
#
# Edit your own copy (Settings → Description rules → "Create my copy"); the app
# reloads it automatically when the file changes. Patterns are Python regular
# expressions, case-insensitive. Use '...' or '''...''' strings so backslashes
# need no escaping.
#
#   [[cleanup]]  regex replacements applied to every description first, in order.
#   [[rule]]     tried in order against the cleaned text (or the raw text with
#                match_on = "raw").
#                - The first rule with a `title` decides how the row is shown.
#                - The first rule with a `kind` sets the type on import
#                  (cc_payment, income, transfer, ...). A rule can have both.
#                Templates use the pattern's named groups: "{name}". Filters can
#                be chained: "{name|company|title}". Filters: title, upper, lower,
#                bank (bank code → name), note (drops empty/boilerplate remarks),
#                company (drops Pvt Ltd / Limited / LLP), autopay (any text → "Auto-pay"),
#                alias (a known name from the [[alias]] lists below, else unchanged).
#                `title` may be a list: the first non-empty one wins.
#                Empty `details` entries are dropped.
#   [[alias]]    pattern → name, for merchants whose bank text is cut or cryptic.
#   my_rules.toml next to settings.json can hold your own [[rule]] and
#                [[alias]] entries (same format). They're tried before these,
#                survive updates to this file and keep personal details (like
#                your own name) out of it.
#   Nothing matched → the cleaned text is shown as is, with bubbles after it.

# ---------------------------------------------------------------- cleanup

[[cleanup]]
name = "Join SBI line wraps (they split words: 'paytm.d19⏎ 7')"
pattern = '\r?\n ?'
replace = ''

[[cleanup]]
name = "Drop the SBI branch trailer ('0097691162095 AT 12345 MG ROAD')"
pattern = '\s{2,}\d{6,}\s+AT\s+\d+\s+.*$'
replace = ''

[[cleanup]]
name = "Drop the SBI ' AT <branch no> <branch>' trailer when no code precedes it"
pattern = '\s+AT\s+\d{4,}\s+[A-Z][A-Z .]*$'
replace = ''

[[cleanup]]
name = "Drop the SBI WDL/DEP TFR prefix"
pattern = '^(WDL|DEP)\s+(TFR|CSH|CHQ|CLG)\s+'
replace = ''

[[cleanup]]
name = "Niyo: the bank keeps 11 characters of the merchant, overwrites the 12th with '/', then the rest ('CORNER CAFE' → 'CORNER CA/E'... the 12th letter lost). Mark the lost letter with ·"
pattern = '^(POS\s+VS(?:\s+REV)?/\d+/[\d:]+/)([^/]{11})/(?=\S)'
replace = '\1\2·'

[[cleanup]]
name = "Statement footer caught in the last row ('... Closing Balance ACCOUNT SCHEME CODE ...')"
pattern = '\s+Closing Balance\b.*$'
replace = ''

[[cleanup]]
name = "Collapse runs of spaces"
pattern = '\s{2,}'
replace = '  '

# ---------------------------------------------------------------- type rules

[[rule]]
name = "Credit card bill payments (not spend: the card purchases are)"
pattern = '''(?:\b(?:cc|credit\s*card)|card)\b.*\b(?:pay(?:ments?)?|bill|dues?)\b|\b(?:pay(?:ment)?|bill)\b.*\bcredit\s*card\b|\bcred\s*club\b|\bbilldesk\b.*card'''
kind = "cc_payment"

# ---------------------------------------------------------------- SBI

[[rule]]
name = "SBI card bill via net banking"
pattern = '^INB\s+SBI\s*CARD'
title = "SBI Card bill payment"
method = "Net banking"
details = ["via BillDesk"]

[[rule]]
name = "SBI UPI  (UPI/DR|CR/<ref>/<name, 8 chars>/<bank>/<UPI id>/<remark>)"
pattern = '''UPI/(?P<dir>DR|CR)/(?P<ref>\d+)/(?P<name>[^/]*)/(?P<bank>[^/]*)/(?P<upi_id>[^/]*)(?:/(?P<note>.*))?'''
title = ["{name|title}", "{upi_id}", "UPI payment"]
method = "UPI"
details = ["{upi_id}", "{bank|bank}", "{note|note}"]
ref = "{ref}"

[[rule]]
name = "NEFT / RTGS / IMPS with stars  (NEFT*<IFSC>*<UTR>*<name>)"
pattern = '(?P<rail>NEFT|RTGS|IMPS)\*(?P<ifsc>[^*]*)\*(?P<ref>[^*]*)\*(?P<name>[^*]*)'
title = ["{name|title}", "{rail|upper} transfer"]
method = "{rail|upper}"
details = ["{ifsc|bank}"]
ref = "{ref}"

[[rule]]
name = "Net banking  (INB <what>  <more>)"
pattern = '^INB\s+(?P<what>.+?)(?:\s{2,}(?P<more>.*))?$'
title = "{what|title}"
method = "Net banking"
details = ["{more}"]

[[rule]]
name = "SBI bulk ACH credit, e.g. dividends  (CEMTEX DEP ACHCr <sponsor+ref> <company>)"
pattern = '^CEMTEX\s+DEP\s+ACH\s*CR\s+(?P<ref>[A-Z]{4}\d+)\s*(?P<name>.+)$'
title = "{name|title}"
method = "ACH credit"
ref = "{ref}"

[[rule]]
name = "SBI transfer to own deposit account (assumed)  (FIRDFTFRREF:<ref> ... OF <holder>)"
pattern = '^FIRDFTFRREF:(?P<ref>\S+)'
title = "Own-account transfer"
method = "Transfer"
details = ["ref {ref}"]
kind = "transfer"

[[rule]]
name = "ATM / cash withdrawal"
match_on = "raw"
pattern = '^WDL\s+(?:CSH\b|.*\bATM\b)'
title = "Cash withdrawal"
method = "Cash"

[[rule]]
name = "Cash deposit"
match_on = "raw"
pattern = '^DEP\s+CSH\b'
title = "Cash deposit"
method = "Cash"

[[rule]]
name = "Interest credited"
pattern = '\bINT(?:EREST)?\.?\s*(?:PD|PAID|CREDIT|CR)\b|^INTEREST'
title = "Interest"
method = "Interest"
kind = "income"

# ---------------------------------------------------------------- SBI Card statements

[[rule]]
name = "SBI Card payment received  (PAYMENT RECEIVED <ref>)"
pattern = '^PAYMENT RECEIVED\b\s*(?P<ref>\S*)'
title = "Payment received"
method = "Card bill"
ref = "{ref}"

[[rule]]
name = "SBI Card purchase  ([WWW] <merchant> [SI] <city> IN [(note)])"
pattern = '''^(?:WWW\s+)?(?P<name>.+?)(?:\s+(?P<si>SI))?\s+(?P<city>NEW DELHI|NAVI MUMBAI|[A-Za-z]+)\s+IN(?:\s+\((?P<note>[^)]*)\))?$'''
title = "{name|company|title}"
method = "Card"
details = ["{city|title}", "{si|autopay}", "{note}"]

# ---------------------------------------------------------------- Niyo (DCB / SBM forex account)

[[rule]]
name = "Niyo card reversal  (POS VS REV/<ref>/<time>/<merchant>)"
pattern = '^POS\s+VS\s+REV/(?P<ref>\d+)/(?P<time>[\d:]+)/(?P<name>.*?)[\s/]*$'
title = ["{name|title|alias} (reversed)", "Card reversal"]
method = "Card refund"
ref = "{ref}"
kind = "refund"

[[rule]]
name = "Niyo Grab ride or food  (POS VS/<ref>/<time>/Grab* <booking>)"
pattern = '^POS\s+VS/(?P<ref>\d+)/(?P<time>[\d:]+)/Grab\*\s*(?P<booking>[^/\s·]*)'
title = "Grab"
method = "Card"
details = ["{booking}", "{time}"]
ref = "{ref}"

[[rule]]
name = "Niyo card spend via a payment processor  (POS VS/<ref>/<time>/<processor>*<merchant>)"
pattern = '^POS\s+VS/(?P<ref>\d+)/(?P<time>[\d:]+)/(?P<via>[A-Za-z]+)\*(?P<name>.+?)[\s/]*$'
title = "{name|title|alias}"
method = "Card"
details = ["via {via|title}", "{time}"]
ref = "{ref}"

[[rule]]
name = "Niyo card spend  (POS VS/<ref>/<time>/<merchant>)"
pattern = '^POS\s+VS/(?P<ref>\d+)/(?P<time>[\d:]+)/(?P<name>.+?)[\s/]*$'
title = "{name|title|alias}"
method = "Card"
details = ["{time}"]
ref = "{ref}"

[[rule]]
name = "Niyo ATM withdrawal abroad  (VISACWD ATM <atm>/<ref>/<time>/<place>)"
pattern = '^VISACWD\s+ATM\s+(?P<atm>\S+)/(?P<ref>\d+)/(?P<time>[\d:]+)/(?P<place>.*?)[\s/]*$'
title = "Cash withdrawal"
method = "ATM"
details = ["{place|title}", "{time}"]
ref = "{ref}"

[[rule]]
name = "Niyo international ATM fee  (DT:<date> INTERNATIONAL ATM CASH WTHDRWL)"
pattern = '^DT:(?P<date>[\d-]+)\s+INTERNATIONAL\s+ATM'
title = "International ATM fee"
method = "Bank fee"
details = ["for {date}"]

[[rule]]
name = "GST on a bank fee  (CGST|SGST|IGST FOR DT:<date> <what>)"
pattern = '^(?P<tax>[CSI]GST)\s+FOR\s+DT:(?P<date>[\d-]+)'
title = "{tax|upper} on bank fee"
method = "Tax"
details = ["for {date}"]

[[rule]]
name = "Niyo UPI  (UPI:REC|PAY:<ref>/<name>/<bank>)"
pattern = '^UPI:(?P<dir>[A-Z]+):(?P<ref>\d+)/(?P<name>[^/]*)/(?P<bank>.*?)\s*$'
title = ["{name|title}", "UPI {dir|lower}"]
method = "UPI"
details = ["{bank}"]
ref = "{ref}"

[[rule]]
name = "Niyo app transfer  (MB NEFT|IMPS/<ref>/<IFSC>/<name>)"
pattern = '^MB\s+(?P<rail>NEFT|IMPS|RTGS)/(?P<ref>[^/]+)/(?P<ifsc>[A-Z]{4})\w*/(?P<name>.*?)\s*$'
title = ["{name|title}", "{rail} transfer"]
method = "{rail|upper}"
details = ["{ifsc|bank}"]
ref = "{ref}"

# ---------------------------------------------------------------- other banks

[[rule]]
name = "UPI with dashes  (UPI-<name>-<UPI id>-...)"
pattern = '^UPI-(?P<name>[^-]+)-(?P<upi_id>[^-\s]+)'
title = "{name|title}"
method = "UPI"
details = ["{upi_id}"]

[[rule]]
name = "Card swipe  (POS <card> <merchant>)"
pattern = '^POS\s+\S+\s+(?P<name>.+)$'
title = "{name|title}"
method = "Card"

[[rule]]
name = "NEFT / IMPS with dashes  (NEFT-<name> <ref>)"
pattern = '^(?P<rail>NEFT|IMPS|RTGS)-(?P<name>.+?)(?:\s+\d+)?$'
title = "{name|title}"
method = "{rail|upper}"

# ---------------------------------------------------------------- lookups

# Known names for merchants whose bank text is cut short or cryptic. Patterns
# match the shown title (after the title filter), case-insensitively; · is a
# letter the bank dropped. Add your own in my_rules.toml (see the top).
# For example:
# [[alias]]
# pattern = '^Corner Ca·e$'
# name = "Corner Cafe"

[title]
# Words the `title` filter keeps in capitals instead of 'Capitalising' them.
keep_upper = ["SBI", "HDFC", "ICICI", "IDFC", "RBL", "UPI", "ATM", "EMI", "LIC", "IRCTC", "BSNL", "PVR",
              "HP", "HPCL", "BPCL", "IOCL", "DMRC", "KFC", "BWW", "UPS", "DHL", "GST", "NEFT", "IMPS", "RTGS"]

[notes]
# Remarks that carry no information (SBI keeps only ~4 characters anyway).
ignore = ["NO R", "NO REMARKS", "UPI", "SENT", "PAY", "PAYM", "PAYMENT", "NA", "NULL"]
min_length = 5

[banks]
# First 4 letters of an IFSC / UPI bank code → display name.
