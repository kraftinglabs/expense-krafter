# Builds the desktop app for Windows and Linux (PyInstaller can't cross-compile,
# so each is built on its own OS) after running the tests.
#   pull request / manual run  -> build both, keep them as workflow artifacts
#   push a tag like v0.1.0     -> build both, then publish a GitHub release with them
#                                 (0.x and versions with a "-" are marked pre-release)
# Release notes come from .github/release-notes/<version>.md when that file exists.
name: Build

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ExpenseKrafter-windows-x64.zip
          - os: ubuntu-24.04
            asset: ExpenseKrafter-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Linux libraries for the Qt window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils \
            libegl1 libgl1 libnss3 libglib2.0-0t64 libfontconfig1 libdbus-1-3 libcups2t64 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 libxcb-randr0 libxcomposite1 libxdamage1 libxrandr2 \
            libxfixes3 libxkbfile1 libxtst6 libxshmfence1 libasound2t64 libwayland-cursor0 libwayland-egl1

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test and build
        run: python build.py  # runs the tests first and stops if they fail

      - name: Zip the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ExpenseKrafter -DestinationPath dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in pyproject.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=".github/release-notes/$version.md"
          flags=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then flags+=(--prerelease); fi
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag \
            --title "ExpenseKrafter $version" "${flags[@]}"
